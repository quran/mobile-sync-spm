name: Release Wrapper

on:
  workflow_dispatch:
    inputs:
      kmp_version:
        description: "Version of the KMP Shared.xcframework release (no leading v; e.g. 0.0.1)"
        required: true
        default: "0.0.1"
      package_version:
        description: "Swift package version to tag (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The release commit is pushed to main before the tag, so a taken version must stop the release here.
      - name: Check versions
        env:
          KMP_VERSION: ${{ inputs.kmp_version }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$KMP_VERSION" =~ $semver ]]; then
            echo "::error::kmp_version '${KMP_VERSION}' must look like 1.2.3, with no leading v."
            exit 1
          fi
          if [[ ! "$PACKAGE_VERSION" =~ $semver ]]; then
            echo "::error::package_version '${PACKAGE_VERSION}' must look like 1.2.3, with no leading v."
            exit 1
          fi

          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v${PACKAGE_VERSION}" > /dev/null || status=$?
          case "$status" in
            0)
              echo "::error::Tag v${PACKAGE_VERSION} already exists; pick the next package_version."
              exit 1
              ;;
            2) ;;
            *)
              echo "::error::Couldn't list the remote tags (git ls-remote exited with ${status})."
              exit 1
              ;;
          esac

      - name: Download Shared.xcframework.zip
        env:
          KMP_VERSION: ${{ inputs.kmp_version }}
        run: |
          curl -L --fail -o Shared.xcframework.zip \
            "https://github.com/quran/mobile-sync/releases/download/v${KMP_VERSION}/Shared-${KMP_VERSION}.xcframework.zip"

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum Shared.xcframework.zip)
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Update Package.swift
        env:
          REMOTE_VERSION: ${{ inputs.kmp_version }}
          REMOTE_CHECKSUM: ${{ steps.checksum.outputs.checksum }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          package = Path("Package.swift")
          data = package.read_text()

          version = os.environ["REMOTE_VERSION"]
          checksum = os.environ["REMOTE_CHECKSUM"]

          data, count_v = re.subn(r'let remoteVersion = ".*"', f'let remoteVersion = "{version}"', data, count=1)
          if count_v != 1:
              raise SystemExit("Failed to update remoteVersion in Package.swift")

          data, count_c = re.subn(r'let remoteChecksum = ".*"', f'let remoteChecksum = "{checksum}"', data, count=1)
          if count_c != 1:
              raise SystemExit("Failed to update remoteChecksum in Package.swift")

          package.write_text(data)
          PY

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.2.app"

      # Same as CI: a failing test stops the release before anything is committed, pushed or tagged.
      - name: Build and test package
        run: scripts/test.sh

      - name: Commit release
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          git add Package.swift
          git commit --allow-empty -m "Release ${PACKAGE_VERSION}"

      - name: Push release commit and tag
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          git push origin HEAD:main
          git tag "v${PACKAGE_VERSION}"
          git push origin "v${PACKAGE_VERSION}"
