name: CI

on:
  push:
    branches:
      - main
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Tests:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.2.app"

      # The checkouts of KMP-NativeCoroutines and RxSwift, and the downloaded Shared.xcframework.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run tests
        run: scripts/test.sh -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
