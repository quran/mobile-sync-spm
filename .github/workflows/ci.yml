name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Tests:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.2.app"

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          simulator_id="$(
            xcrun simctl list devices available --json |
              python3 -c 'import json, sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))'
          )"
          xcrun xcodebuild \
            -scheme MobileSync \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            build test
